name: Supabase Keep-Alive

# Supabase pauses Free Plan projects after 7 days without API requests or
# database queries. This pings PostgREST on a 3-day cadence so the inactivity
# timer never runs out, leaving room for a skipped or delayed run.

on:
  schedule:
    # 06:17 UTC every 3rd day of the month (1st, 4th, 7th, ... 31st).
    # Off-the-hour minute: GitHub delays crons that start on the hour.
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # A PostgREST select reaches Postgres, which is what resets the
          # timer. RLS returns no rows for the anon key - that is expected
          # and fine; the query still runs.
          http_status=$(curl -sS --max-time 30 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -o response.json -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/jobs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          if [ "$http_status" != "200" ]; then
            echo "::error::Keep-alive ping failed with HTTP $http_status."
            echo "The project may already be paused, or the anon key may have been rotated."
            echo "Response body:"
            cat response.json
            exit 1
          fi

          echo "Supabase responded HTTP 200 - inactivity timer reset."
